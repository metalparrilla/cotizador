<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Online de Parrillas</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .cotizador-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fff;
        }

        .medidas-row {
            display: flex;
            gap: 15px;
        }

        .medidas-row .form-group {
            flex: 1;
        }

        .btn-cotizar {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-cotizar:hover {
            background-color: #b71c1c;
        }

        .resultado-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ffebee;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }

        .resultado-box p {
            margin: 8px 0;
            font-size: 16px;
        }

        .resultado-destacado {
            font-size: 20px !important;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="cotizador-container">
    <h2>Cotizá tu Parrilla</h2>
    
    <div class="form-group">
        <label for="altura">Altura del emparrillado</label>
        <select id="altura">
            <option value="Fija">Fija</option>
            <option value="Variable">Variable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="modelo">Modelo</label>
        <select id="modelo">
            <option value="Clásica">Clásica</option>
            <option value="Flotante">Flotante</option>
            <option value="Mecano">Mecano</option>
        </select>
    </div>

    <div class="form-group">
        <label for="estructura">Material de la Estructura</label>
        <select id="estructura">
            <option value="Hierro">Hierro</option>
            <option value="Inoxidable">Inoxidable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="emparrillado">Material del Emparrillado</label>
        <select id="emparrillado">
            <option value="Hierro redondo">Hierro redondo</option>
            <option value="Hierro ángulo">Hierro ángulo</option>
            <option value="Inoxidable redondo">Inoxidable redondo</option>
            <option value="Ángulo inoxidable">Ángulo inoxidable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="brasero">Brasero</label>
        <select id="brasero">
            <option value="Sin brasero">Sin brasero</option>
            <option value="Abierto">Abierto</option>
            <option value="Tipo V">Tipo V</option>
            <option value="Tipo U">Tipo U</option>
            <option value="Puerta chapa">Puerta chapa</option>
            <option value="Puerta vitro">Puerta vitro</option>
        </select>
    </div>

    <div class="medidas-row">
        <div class="form-group">
            <label for="ancho">Ancho (mts)</label>
            <input type="number" id="ancho" value="1.00" step="0.05" min="0.1">
        </div>
        <div class="form-group">
            <label for="profundidad">Profundidad (mts)</label>
            <input type="number" id="profundidad" value="0.50" step="0.05" min="0.1">
        </div>
    </div>

    <button class="btn-cotizar" id="btnCalcular">Calcular Presupuesto</button>

    <div id="resultado" class="resultado-box">
        <p>Área total estimada: <span id="resArea" style="font-weight: bold;"></span> m²</p>
        <p>Valor base por m²: <span id="resValorM2" style="font-weight: bold;"></span> USD</p>
        <p class="resultado-destacado">Total: <span id="resUSD"></span> USD</p>
        <p class="resultado-destacado">Total estimado: <span id="resARS"></span> ARS</p>
    </div>
</div>

<script>
    const TIPO_CAMBIO = 1600;

    // Lógica Matemática de Precios por Componente (Suma de Atributos)
    // Esto garantiza que el cotizador NUNCA falle, no importa qué combinación toque el usuario
    function calcularCotizacion() {
        const alt = document.getElementById("altura").value;
        const mod = document.getElementById("modelo").value;
        const est = document.getElementById("estructura").value;
        const emp = document.getElementById("emparrillado").value;
        const bra = document.getElementById("brasero").value;
        
        const ancho = parseFloat(document.getElementById("ancho").value) || 0;
        const prof = parseFloat(document.getElementById("profundidad").value) || 0;
        const area = ancho * prof;

        if (area <= 0) {
            alert("Por favor, ingresá medidas válidas de Ancho y Profundidad.");
            return;
        }

        // 1. Precio Base por Estructura y Altura
        let precioM2 = 330; // Base inicial: Fija + Hierro
        
        if (alt === "Variable" || mod === "Mecano") {
            precioM2 += 120; // Plus por ingeniería Mecano / Variable
        } else if (mod === "Flotante") {
            precioM2 += 15;
        }

        if (est === "Inoxidable") {
            precioM2 += 150; // Plus por Estructura de Acero Inoxidable
        }

        // 2. Plus por Material de Emparrillado
        if (emp === "Hierro ángulo") {
            precioM2 += 60;
        } else if (emp === "Inoxidable redondo") {
            precioM2 += 75;
        } else if (emp === "Ángulo inoxidable") {
            precioM2 += 140;
        }

        // 3. Plus por Tipo de Brasero / Accesorios
        if (bra === "Abierto") {
            precioM2 += 25;
        } else if (bra === "Tipo V") {
            precioM2 += 40;
        } else if (bra === "Tipo U") {
            precioM2 += 65;
        } else if (bra === "Puerta chapa") {
            precioM2 += 90;
        } else if (bra === "Puerta vitro") {
            precioM2 += 175;
        }

        // Límites comerciales estrictos de tu negocio
        if (precioM2 < 330) precioM2 = 330;
        if (precioM2 > 1300) precioM2 = 1300;

        // Cálculos finales de dinero
        const totalUSD = area * precioM2;
        const totalARS = totalUSD * TIPO_CAMBIO;
        
        // Renderizado en pantalla
        document.getElementById("resArea").textContent = area.toFixed(2);
        document.getElementById("resValorM2").textContent = precioM2.toLocaleString('es-AR');
        document.getElementById("resUSD").textContent = totalUSD.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById("resARS").textContent = totalARS.toLocaleString('es-AR', {maximumFractionDigits: 0});
        
        document.getElementById("resultado").style.display = "block";
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("btnCalcular").addEventListener("click", calcularCotizacion);
    });
</script>

</body>
</html>
