<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Online de Parrillas</title>
    <style>
        :root {
            --primary-color: #25D366;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .cotizador-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #d32f2f;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fff;
        }

        .medidas-row {
            display: flex;
            gap: 15px;
        }

        .medidas-row .form-group {
            flex: 1;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

<div class="cotizador-container">
    <h2>Cotizá tu Parrilla</h2>
    
    <div class="form-group">
        <label for="altura">¿Altura fija o variable?</label>
        <select id="altura">
            <option value="Fija">Fija</option>
            <option value="Variable">Variable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="modelo">Modelo</label>
        <select id="modelo">
            <option value="Clásica">Clásica</option>
            <option value="Flotante">Flotante</option>
            <option value="Mecano">Mecano</option>
        </select>
    </div>

    <div class="form-group">
        <label for="estructura">Material de la Estructura</label>
        <select id="estructura">
            <option value="Hierro">Hierro</option>
            <option value="Enlozado">Enlozado</option>
            <option value="Inoxidable">Inoxidable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="emparrillado">Material del Emparrillado</label>
        <select id="emparrillado">
            <option value="Hierro redondo">Hierro redondo</option>
            <option value="Hierro ángulo">Hierro ángulo</option>
            <option value="Inoxidable redondo">Inoxidable redondo</option>
            <option value="Inoxidable ángulo">Inoxidable ángulo</option>
            <option value="Enlozado redondo">Enlozado redondo</option>
            <option value="Enlozado ángulo">Enlozado ángulo</option>
        </select>
    </div>

    <div class="form-group">
        <label for="brasero">Brasero</label>
        <select id="brasero">
            <option value="Sin brasero">Sin brasero</option>
            <option value="Abierto">Abierto</option>
            <option value="Tipo V">Tipo V</option>
            <option value="Tipo U">Tipo U</option>
            <option value="Puerta chapa">Puerta chapa</option>
            <option value="Puerta vitro">Puerta vitro</option>
        </select>
    </div>

    <div class="medidas-row">
        <div class="form-group">
            <label for="ancho">Ancho (mts)</label>
            <input type="number" id="ancho" value="1.00" step="0.05" min="0.1">
        </div>
        <div class="form-group">
            <label for="profundidad">Profundidad (mts)</label>
            <input type="number" id="profundidad" value="0.50" step="0.05" min="0.1">
        </div>
    </div>

    <button class="btn-whatsapp" id="btnEnviarWhatsApp">Enviar cotización a WhatsApp</button>
</div>

<script>
    const TIPO_CAMBIO = 1600;
    const NUMERO_WHATSAPP = "5491159367696";

    function enviarMensajeWhatsApp() {
        const alt = document.getElementById("altura").value;
        const mod = document.getElementById("modelo").value;
        const est = document.getElementById("estructura").value;
        const emp = document.getElementById("emparrillado").value;
        const bra = document.getElementById("brasero").value;
        
        const ancho = parseFloat(document.getElementById("ancho").value) || 0;
        const prof = parseFloat(document.getElementById("profundidad").value) || 0;
        const area = ancho * prof;
        
        if (area <= 0) {
            alert("Por favor, ingresá medidas válidas para el Ancho y la Profundidad.");
            return;
        }

        // --- SISTEMA MATEMÁTICO INDESTRUCTIBLE DE CÁLCULO ---
        let valorM2 = 330; // Valor base por defecto (Fija + Clásica + Hierro)

        // 1. Modificadores por Altura / Modelo
        if (alt === "Variable" || mod === "Mecano") {
            valorM2 += 235; // Plus para bases Mecano / Variable
        } else if (mod === "Flotante") {
            valorM2 += 0; // Tienen el mismo costo base en tu lista
        }

        // 2. Modificadores por Estructura
        if (est === "Enlozado") {
            valorM2 += 150;
        } else if (est === "Inoxidable") {
            valorM2 += 150;
        }

        // 3. Modificadores por Emparrillado
        if (emp === "Hierro ángulo") {
            valorM2 += 90;
        } else if (emp === "Inoxidable redondo") {
            valorM2 += 75;
        } else if (emp === "Inoxidable ángulo" || emp === "Enlozado ángulo") {
            valorM2 += 250;
        } else if (emp === "Enlozado redondo") {
            valorM2 += 150;
        }

        // 4. Modificadores por Brasero
        if (bra === "Abierto") {
            valorM2 += 35;
        } else if (bra === "Tipo V") {
            valorM2 += 95;
        } else if (bra === "Tipo U") {
            valorM2 += 145;
        } else if (bra === "Puerta chapa") {
            valorM2 += 180;
        } else if (bra === "Puerta vitro") {
            valorM2 += 280;
        }

        // Ajuste estricto de topes de tu lista comercial ($330 a $1410)
        if (valorM2 < 330) valorM2 = 330;
        if (valorM2 > 1410) valorM2 = 1410;

        const totalUSD = area * valorM2;
        const totalARS = totalUSD * TIPO_CAMBIO;
        
        const mensaje = `¡Hola! Quiero solicitar un presupuesto con este desglose:\n\n` +
                        `• Altura: ${alt}\n` +
                        `• Modelo: ${mod}\n` +
                        `• Estructura: ${est}\n` +
                        `• Emparrillado: ${emp}\n` +
                        `• Brasero: ${bra}\n` +
                        `• Dimensiones: ${ancho.toFixed(2)}m x ${prof.toFixed(2)}m (Área: ${area.toFixed(2)} m²)\n\n` +
                        `*Total estimado: ${totalUSD.toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} USD / ${totalARS.toLocaleString('es-AR', {maximumFractionDigits: 0})} ARS*`;
        
        const url = `https://wa.me{5491159367696}?text=${encodeURIComponent(mensaje)}`;
        window.location.href = url;
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("btnEnviarWhatsApp").addEventListener("click", enviarMensajeWhatsApp);
    });
</script>

</body>
</html>
