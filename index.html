<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador Online de Parrillas</title>
    <style>
        :root {
            --primary-color: #d32f2f;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .cotizador-container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fff;
        }

        .medidas-row {
            display: flex;
            gap: 15px;
        }

        .medidas-row .form-group {
            flex: 1;
        }

        .btn-cotizar {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-cotizar:hover {
            background-color: #b71c1c;
        }

        .resultado-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #ffebee;
            border-left: 5px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }

        .resultado-box p {
            margin: 8px 0;
            font-size: 16px;
        }

        .resultado-destacado {
            font-size: 20px !important;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="cotizador-container">
    <h2>Cotizá tu Parrilla</h2>
    
    <div class="form-group">
        <label for="altura">¿Altura fija o variable?</label>
        <select id="altura">
            <option value="Fija">Fija</option>
            <option value="Variable">Variable</option>
        </select>
    </div>

    <div class="form-group">
        <label for="modelo">Modelo</label>
        <select id="modelo">
            <!-- Dinámico -->
        </select>
    </div>

    <div class="form-group">
        <label for="estructura">Material de la Estructura</label>
        <select id="estructura">
            <!-- Dinámico -->
        </select>
    </div>

    <div class="form-group">
        <label for="emparrillado">Material del Emparrillado</label>
        <select id="emparrillado">
            <!-- Dinámico -->
        </select>
    </div>

    <div class="form-group">
        <label for="brasero">Brasero</label>
        <select id="brasero">
            <!-- Dinámico -->
        </select>
    </div>

    <div class="medidas-row">
        <div class="form-group">
            <label for="ancho">Ancho (mts)</label>
            <input type="number" id="ancho" value="1.00" step="0.05" min="0.1">
        </div>
        <div class="form-group">
            <label for="profundidad">Profundidad (mts)</label>
            <input type="number" id="profundidad" value="0.50" step="0.05" min="0.1">
        </div>
    </div>

    <button class="btn-cotizar" id="btnCalcular">Calcular Presupuesto</button>

    <div id="resultado" class="resultado-box">
        <p>Área total estimada: <span id="resArea" style="font-weight: bold;"></span> m²</p>
        <p>Valor base por m²: <span id="resValorM2" style="font-weight: bold;"></span> USD</p>
        <p class="resultado-destacado">Total: <span id="resUSD"></span> USD</p>
        <p class="resultado-destacado">Total estimado: <span id="resARS"></span> ARS</p>
    </div>
</div>
